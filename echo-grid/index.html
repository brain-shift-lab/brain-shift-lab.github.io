<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo Grid</title>
<meta name="description" content="Echo Grid — เกมฝึกความจำใช้งานแบบ dual N-back จาก brain-shift-lab">
<meta name="theme-color" content="#121120">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121120'/%3E%3Cg fill='%23322F4F'%3E%3Crect x='4' y='4' width='7' height='7' rx='2'/%3E%3Crect x='12.5' y='4' width='7' height='7' rx='2'/%3E%3Crect x='4' y='12.5' width='7' height='7' rx='2'/%3E%3Crect x='21' y='12.5' width='7' height='7' rx='2'/%3E%3Crect x='4' y='21' width='7' height='7' rx='2'/%3E%3Crect x='12.5' y='21' width='7' height='7' rx='2'/%3E%3Crect x='21' y='21' width='7' height='7' rx='2'/%3E%3C/g%3E%3Crect x='21' y='4' width='7' height='7' rx='2' fill='%23C4B5FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="config.js"></script>
<style>
/* Sibling of Signal Shift: same cabinet look; the stage is a 3×3 grid whose centre carries the N. */
:root{
  color-scheme: dark;
  --bg:#121120; --panel:#1B1A2D; --panel2:#24223A; --line:#322F4F;
  --fg:#EEEAFE; --muted:#A29DC8; --accent:#C4B5FF;
  --good:#5FE0B2; --hot:#FF5470; --blue:#4F8CFF; --orange:#FF9D42;
  --f-display:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 0,var(--bg) 75%);pointer-events:none;z-index:0}
body.boss-on::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,var(--hot) 160%);opacity:.35;animation:bosspulse 1.1s ease-in-out infinite}
@keyframes bosspulse{50%{opacity:.6}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
kbd{font-family:var(--f-mono);font-size:.85em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;max-width:1040px;width:100%;margin-inline:auto}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
.brand b{color:var(--fg)}
.tb-actions{display:flex;gap:8px}
.chipbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-weight:600;letter-spacing:.04em}
.chipbtn:hover,.chipbtn[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}

main{flex:1;display:flex;max-width:1040px;width:100%;margin-inline:auto;padding-block:8px 20px}
.screen{flex:1;min-width:0}
footer{max-width:1040px;width:100%;margin-inline:auto;padding-block:8px 20px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;cursor:pointer;border:1px solid var(--line);background:var(--panel);transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.primary:hover{background:var(--fg)}
.btn.daily{border-color:var(--orange)}
.btn small{font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.75;text-align:right}
.btn.sm{padding:9px 14px;font-size:14px}

/* title */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(52px,9vw,104px);line-height:.86;letter-spacing:-.01em;margin:14px 0 18px}
.logo span{display:block}
.logo .s2{color:transparent;-webkit-text-stroke:2px var(--accent);padding-left:.5em}
.tagline{color:var(--muted);max-width:46ch;font-size:16px;margin:0 0 20px;text-wrap:balance}
.menu{display:flex;flex-direction:column;gap:10px;max-width:400px}
.menu .btn{justify-content:space-between}
.menu-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menu-row .btn{justify-content:center;padding:10px 8px;font-size:14px}
.best{margin-top:16px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.best b{color:var(--fg);font-family:var(--f-mono)}
.demo{position:relative;width:100%}
.demo-cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;margin-top:8px;min-height:1.6em}
.constructs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}

/* stage */
.stage-wrap{position:relative;width:min(100%,380px);margin-inline:auto}
.cue{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-align:center;font-size:18px;height:30px;color:var(--accent);white-space:nowrap;overflow:hidden}
svg.stage{width:100%;height:auto;display:block;overflow:visible}
svg.stage .cell{fill:var(--panel);stroke:var(--line);stroke-width:2;transition:fill .08s}
svg.stage .cell.on{fill:var(--accent);stroke:var(--accent)}
svg.stage .core{fill:var(--bg);stroke:var(--line);stroke-width:2;stroke-dasharray:3 6}
svg.stage .nnum{fill:var(--fg);font-family:var(--f-display);font-weight:700;font-size:40px}
svg.stage .nlab{fill:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.2em}
svg.stage .ndot{fill:var(--accent)}
svg.stage .ndot.s{fill:var(--orange)}
.stage-wrap canvas{position:absolute;inset:30px 0 0 0;width:100%;height:calc(100% - 30px);pointer-events:none}
.flash-good svg.stage .core{stroke:var(--good);stroke-dasharray:none}
.flash-bad svg.stage .core{stroke:var(--hot);stroke-dasharray:none}
.shake{animation:shake .28s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fbtext{position:absolute;left:0;right:0;top:calc(30px + 50% - 30px);text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;pointer-events:none;opacity:0;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
.fbtext.on{animation:rise .7s ease-out}
@keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-28px)}}

/* game */
#scr-game{display:flex;flex-direction:column;gap:12px}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:stretch}
.hud .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.hud .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .val{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:4px;padding-top:6px}
.pip{width:12px;height:12px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--good)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#scr-game.boss .progress{height:10px}
#scr-game.boss .progress i{background:var(--hot)}
#scr-game.boss .hud .cell{border-color:var(--hot)}
.bossbar{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;color:var(--hot);font-size:13px;margin-bottom:-6px}
.legend{text-align:center;min-height:24px;font-size:14px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;width:100%;margin-inline:auto}
.pad{height:80px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-display);font-weight:700;font-size:22px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .08s,border-color .08s,box-shadow .12s}
.pad small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.pad.p small::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:1px}
.pad.s small::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:1px}
.pad.hit{background:var(--panel2);border-color:var(--accent)}
.pad.good{border-color:var(--good);box-shadow:0 0 0 2px var(--good),0 0 18px -2px var(--good)}
.pad.bad{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot),0 0 18px -2px var(--hot)}
.pad:disabled{opacity:.25;cursor:default}
.meta-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);max-width:420px;width:100%;margin-inline:auto}
.quit{background:none;border:1px solid var(--line);border-radius:10px;color:var(--muted);padding:0 12px;cursor:pointer;font-size:13px}
.quit:hover{color:var(--hot);border-color:var(--hot)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:640px;margin-inline:auto}
.panel.boss{border-color:var(--hot)}
.panel.boss .eyebrow{color:var(--hot)}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.panel p{color:var(--muted);margin:0 0 14px}
.notice{font-family:var(--f-display);font-weight:600;color:var(--good);margin-bottom:10px}
.notice.bad{color:var(--hot)}
.rulechips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.rchip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.rchip svg{width:26px;height:26px}
.rchip.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rchip .nb{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--bg);font-family:var(--f-display);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px;color:var(--fg)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.protocol{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 18px}
.protocol td{padding:6px 0;border-bottom:1px solid var(--line)}
.protocol td:last-child{text-align:right;font-family:var(--f-mono);color:var(--muted)}

/* how */
.howgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.howcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;min-width:0}
.howcard h3{font-family:var(--f-display);font-size:18px;margin:0 0 4px;letter-spacing:.04em}
.howcard p{margin:0;color:var(--muted);font-size:14px}
.howcard .measure{display:block;margin-top:8px;font-size:12px;font-family:var(--f-mono);color:var(--accent)}
.howcard svg{width:72px;height:72px}
.pagehead h2{font-family:var(--f-display);font-size:34px;margin:6px 0 6px;line-height:1.1}
.pagehead p{color:var(--muted);margin:0;max-width:62ch}
.seqbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:18px}
.seqbox h3{font-family:var(--f-display);font-size:15px;margin:0 0 10px;letter-spacing:.04em}
.seq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.seq figure{margin:0;text-align:center;min-width:0}
.seq svg{width:100%;height:auto;max-width:110px}
.seq figcaption{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.4}
.seq figcaption b{display:block;color:var(--fg);font-family:var(--f-display);font-size:13px}

/* results */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;margin:2px 0;overflow-wrap:anywhere}
.tile .n{font-size:12px;color:var(--muted);line-height:1.4}
.tile.lead{border-color:var(--accent)}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.chartbox h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px;letter-spacing:.04em}
.chartbox .sub{font-size:12px;color:var(--muted);margin:-4px 0 6px}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .bar{fill:var(--accent)}
.chart .bar.s{fill:var(--orange)}
.chart .grid{stroke:var(--line)}
.chart .zero{stroke:var(--muted)}
.chart .vlab{fill:var(--fg)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .area{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.chart .dot.daily{stroke:var(--orange)}
.chart .dot.research{stroke:var(--good)}
.chart .end{fill:var(--accent)}
.chartscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartscroll svg{display:block;max-width:none}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:-1px}
.keyrow i.s{background:var(--orange);border-radius:50%}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.ok::before{background:var(--good)}
.status.err::before{background:var(--hot)}
textarea.csv{width:100%;height:120px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-family:var(--f-mono);font-size:11px;padding:8px}
.res-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px}
.res-head h2{font-family:var(--f-display);font-size:34px;margin:4px 0 0}
.bigscore{font-family:var(--f-mono);font-size:40px;color:var(--accent)}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;font-size:13px;color:var(--muted)}
.delta{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.delta.up{border-color:var(--good);color:var(--good)}
.delta.down{border-color:var(--hot);color:var(--hot)}
.boardbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.boardbox .lab{font-family:var(--f-display);font-weight:600}
.boardbox input{width:180px}
.rank{font-family:var(--f-display);font-weight:700;color:var(--orange)}

.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:16px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data td.name{font-family:var(--f-body);white-space:normal;overflow-wrap:anywhere}
table.data tr:last-child td{border-bottom:0}
table.data tr.me td{background:var(--panel2);color:var(--accent)}
table.data td.r1{color:var(--orange);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.namebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.namebar input{width:200px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:20px}
  .demo-col{order:-1;max-width:240px;margin-inline:auto;width:100%}
  .howgrid{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:1fr}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
  .hud .cell.hide-sm{display:none}
  .panel{padding:20px}
  .menu{max-width:none}
  .seq{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .seq figcaption{font-size:10px}
}
@media (max-height:700px) and (max-width:760px){ .stage-wrap{width:min(100%,300px)} .pad{height:68px} }
@media (prefers-reduced-motion:reduce){
  .shake{animation:none}.fbtext.on{animation:none;opacity:0}
  .btn,.btn:hover{transition:none;transform:none}
  body.boss-on::after{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="brand" type="button">ECHO <b>GRID</b></button>
    <div class="tb-actions">
      <button class="chipbtn" id="sound-btn" type="button"></button>
      <button class="chipbtn" id="lang-btn" type="button">EN</button>
    </div>
  </header>

  <main>
    <!-- TITLE -->
    <section class="screen" id="scr-title">
      <div class="hero">
        <div>
          <div class="eyebrow" data-i="eyebrow"></div>
          <h1 class="logo"><span>ECHO</span><span class="s2">GRID</span></h1>
          <p class="tagline" data-i="tagline"></p>
          <div class="constructs" id="constructs"></div>
          <div class="menu">
            <button class="btn primary" id="go-arcade" type="button"><span data-i="playArcade"></span><small data-i="playArcadeSub"></small></button>
            <button class="btn daily" id="go-daily" type="button"><span data-i="daily"></span><small id="daily-sub"></small></button>
            <button class="btn" id="go-research" type="button"><span data-i="research"></span><small data-i="researchSub"></small></button>

/* ---------------- random (seedable for the daily challenge) ---------------- */
let RNG = Math.random;
const rand = () => RNG();
const pick = a => a[Math.floor(rand() * a.length)];
function seeded(str){
  let hsh = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ hsh = Math.imul(hsh ^ str.charCodeAt(i), 3432918353); hsh = hsh << 13 | hsh >>> 19; }
  let a = hsh >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const range = (a, b) => Array.from({length:Math.max(0, b - a)}, (_, i) => a + i);

/* ---------------- sequence generation ----------------
   One channel = 8 possible values. Exactly nT targets are placed at random among the scorable
   trials (i >= N). Non-targets never equal the N-back item; with probability lureP they copy
   the (N-1)- or (N+1)-back item instead (a lure), otherwise they avoid those too.          */
const K = 8;
function genChannel(len, N, nT, lureP){
  const tg = new Set(shuffle(range(N, len)).slice(0, nT));
  const v = [];
  for(let i = 0; i < len; i++){
    if(i < N){ let x; do { x = Math.floor(rand() * K); } while(i > 0 && x === v[i - 1]); v.push(x); continue; }
    if(tg.has(i)){ v.push(v[i - N]); continue; }
    const ban = v[i - N];
    const lures = [];
    if(N >= 2) lures.push(v[i - N + 1]);
    if(i - N - 1 >= 0) lures.push(v[i - N - 1]);
    const L = [...new Set(lures)].filter(x => x !== ban);
    if(L.length && rand() < lureP) v.push(pick(L));
    else v.push(pick(range(0, K).filter(x => x !== ban && !L.includes(x))));
  }
  return v;
}
const isLure = (v, i, N) => i >= N && v[i] !== v[i - N] && ((N >= 2 && v[i] === v[i - N + 1]) || (i - N - 1 >= 0 && v[i] === v[i - N - 1])) ? 1 : 0;

/* ---------------- fx ---------------- */
const fx = $('#fx'), fxc = fx.getContext('2d');
let parts = [], fxOn = false;
function burst(color, n = 22, pos = null){
  if(REDUCED) return;
  const rect = fx.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if(!rect.width) return;
  fx.width = rect.width * dpr; fx.height = rect.height * dpr;
  let cx = fx.width / 2, cy = fx.height / 2;
  if(pos !== null && pos !== undefined){ const [x, y] = slotXY(SLOTS[pos]); cx = (x + 42) / 300 * fx.width; cy = (y + 42) / 300 * fx.height; }
  const col = getComputedStyle(document.documentElement).getPropertyValue(color).trim();
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
    parts.push({x:cx, y:cy, vx:Math.cos(a) * s * dpr, vy:Math.sin(a) * s * dpr, life:1, col, sz:(2 + Math.random() * 3) * dpr});
  }
  if(!fxOn){ fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fxc.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= .95; p.vy *= .95; p.life -= .03;
    fxc.globalAlpha = Math.max(0, p.life); fxc.fillStyle = p.col; fxc.fillRect(p.x, p.y, p.sz, p.sz); });
  fxc.globalAlpha = 1;
  if(parts.length) requestAnimationFrame(fxLoop); else fxOn = false;
}
let fbTimer = null;
function feedback(ok, text, color){
  const w = $('#stage-wrap'), ft = $('#fbtext');
  w.classList.remove('flash-good', 'flash-bad', 'shake'); void w.offsetWidth;
  if(ok !== null){ w.classList.add(ok ? 'flash-good' : 'flash-bad'); if(!ok && !REDUCED) w.classList.add('shake'); }
  clearTimeout(fbTimer); fbTimer = setTimeout(() => w.classList.remove('flash-good', 'flash-bad', 'shake'), 420);
  ft.textContent = text; ft.style.color = `var(${color})`;
  ft.classList.remove('on'); void ft.offsetWidth; ft.classList.add('on');
}

/* ---------------- trial engine ---------------- */
const showFb = (r, cfg) => r.mode !== 'research' || r.feedback || cfg.practice;
function onPress(T, ch){
  const {r, cfg, tr} = T;
  if(!RUN || RUN !== r) return;
  const fb = showFb(r, cfg);
  if(tr.warmup){ padFlash(ch, 'hit', 120); if(fb) feedback(null, t('early'), '--muted'); return; }
  const target = ch === 'P' ? tr.posTarget : tr.symTarget;
  if(target){
    padFlash(ch, fb ? 'good' : 'hit', fb ? 260 : 90);
    if(r.mode !== 'research'){
      r.combo++; r.mult = Math.min(8, 1 + Math.floor(r.combo / 4));
      const rt = T.resp[ch];
      const pts = Math.round((100 + Math.max(0, cfg.soa - rt) / 10) * r.mult * cfg.n);
      r.score += pts;
      let label = '+' + pts;
      if(cfg.boss){
        const dmg = r.mult >= 4 ? 2 : 1;
        r.bossHp -= dmg; if(dmg === 2) label = t('crit') + ' ' + label;
        Music.tempo = 116 + 70 * (1 - Math.max(0, r.bossHp) / r.bossMax);
      }
      feedback(true, label, '--good'); burst(cfg.boss ? '--hot' : '--good', cfg.boss ? 30 : 20, tr.pos); sfx.good(r.mult);
      updateHud();
    } else if(fb){ feedback(true, t('hit'), '--good'); sfx.good(1); }
  } else {
    padFlash(ch, fb ? 'bad' : 'hit', fb ? 320 : 90);
    if(r.mode !== 'research'){ r.combo = 0; r.mult = 1; updateHud(); }
    if(fb){ feedback(false, t('fa'), '--hot'); sfx.bad(); }
  }
}
async function runBlock(r, cfg, blockIdx){
  const S = $('#stage');
  r.cfg = cfg; r.ti = 0; r.blockN = cfg.len; r.blockTrials = [];
  const N = cfg.n, nT = Math.round(.3 * (cfg.len - N)), lureP = .12;
  const P = genChannel(cfg.len, N, nT, lureP);
  const Y = cfg.dual ? genChannel(cfg.len, N, nT, lureP) : null;
  $('#pad-s').disabled = !cfg.dual;
  setHudLabels(); setLegend(cfg, 0);
  drawGrid(S, N, cfg.dual, null);
  await wait(900); alive(r);
  const chs = cfg.dual ? ['P', 'S'] : ['P'];
  for(let i = 0; i < cfg.len; i++){
    alive(r);
    const warm = i < N;
    const tr = {
      pid:r.pid || '', session:r.session || '', mode:r.mode, block:cfg.key, blockIdx, trial:i + 1, level:r.level || '',
      n:N, dual:cfg.dual ? 1 : 0, soa:cfg.soa, stimMs:cfg.stim,
      pos:P[i], sym:Y ? Y[i] : '',
      posTarget: warm ? '' : (P[i] === P[i - N] ? 1 : 0), symTarget: warm || !Y ? '' : (Y[i] === Y[i - N] ? 1 : 0),
      posLure: warm ? '' : isLure(P, i, N), symLure: warm || !Y ? '' : isLure(Y, i, N),
      posResp:0, symResp: Y ? 0 : '', posRT:'', symRT:'', posCorrect:'', symCorrect:'',
      warmup: warm ? 1 : 0, practice: cfg.practice ? 1 : 0, ts:''
    };
    setLegend(cfg, i);
    drawGrid(S, N, cfg.dual, {pos:tr.pos, sym:tr.sym});
    await frameTick();
    const onset = performance.now();
    tr.ts = new Date().toISOString();
    TRIAL = {r, cfg, tr, onset, resp:{P:null, S:null}};
    if(r.mode !== 'research') sfx.tick();
    await waitUntil(onset + cfg.stim); alive(r);
    drawGrid(S, N, cfg.dual, null);
    await waitUntil(onset + cfg.soa); alive(r);
    const T = TRIAL; TRIAL = null;
    // score both channels
    const fb = showFb(r, cfg);
    let missed = false;
    chs.forEach(ch => {
      const pressed = T.resp[ch] !== null;
      const key = ch === 'P' ? 'pos' : 'sym';
      tr[key + 'Resp'] = pressed ? 1 : 0;
      tr[key + 'RT'] = pressed ? T.resp[ch] : '';
      if(!warm){
        const target = tr[key + 'Target'] === 1;
        tr[key + 'Correct'] = pressed === target ? 1 : 0;
        if(target && !pressed){ missed = true; if(fb) padFlash(ch, 'bad', 320); }
      }
    });
    if(missed){
      if(r.mode !== 'research'){ r.combo = 0; r.mult = 1; }
      if(fb){ feedback(false, t('miss'), '--hot'); sfx.bad(); }
    }
    r.trials.push(tr); r.blockTrials.push(tr);
    r.ti = i + 1;
    updateHud();
    if(cfg.boss && r.bossHp <= 0){ await wait(400); return {res:'boss-win'}; }
  }
  const cs = chanTrials(r.blockTrials);
  return {res: cfg.boss ? 'boss-escape' : 'done', acc: cs.length ? cs.filter(c => c.correct).length / cs.length : 0};
}

        chips: chipsFor(cfg), notice: nb, noticeBad: bad
      });
      notice = null; alive(r);
      show('game');
      const res = await runBlock(r, cfg, L);
      const pct = Math.round(100 * res.acc);
      if(res.acc < PASS){
        r.lives--; sfx.bad();
        if(r.lives <= 0) break;
        notice = t('failNote', pct); noticeBad = true;
        continue; // retry the same level
      }
      const bonus = res.acc >= PERFECT && r.lives < 5;
      r.score += 500 * L; if(bonus) r.lives++;
      r.maxN = Math.max(r.maxN, cfg.n); r.cleared = L;
      sfx.level();
      notice = t('passNote', L, pct, bonus); noticeBad = false;
      if(L % 5 === 0){
        const b = L / 5, bc = bossConfig(b, cfg);
        const nb2 = notice;
        await interScreen({
          eyebrow: () => t('bossEyebrow', b), title: () => t('bossNames')[(b - 1) % 4],
          body: () => t('bossBody') + ' ' + t('lv_next', bc.n, true, (bc.soa / 1000).toFixed(1)) + '.', chips: chipsFor(bc), boss:true,
          notice: nb2, noticeBad:false
        });
        alive(r);
        r.bossHp = r.bossMax = bc.hp;
        $('#scr-game').classList.add('boss'); $('#bossbar').hidden = false; document.body.classList.add('boss-on');
        show('game'); sfx.boss(); setTimeout(() => { if(RUN === r) Music.start(); }, 500);
        const br = await runBlock(r, bc, bc.key);
        endBossFx();
        if(br.res === 'boss-win'){ const bonus2 = 3000 * b; r.score += bonus2; r.lives = Math.min(5, r.lives + 2); r.bosses++; notice = t('bossWin', bonus2); noticeBad = false; sfx.level(); }
        else { notice = t('bossEscape'); noticeBad = true; }
      }
      r.level++;
    }
    endBossFx(); sfx.over();
    finishRun(r);
  }catch(e){ endBossFx(); if(e !== ABORT) console.error(e); }
}

/* ---------------- analysis ---------------- */
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const median = a => { if(!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function invNorm(p){
  const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
  const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
  const c = [-.007784894002430293, -.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [.007784695709041462, .3224671290700398, 2.445134137142996, 3.754408661907416];
  const pl = .02425; let q, r;
  if(p < pl){ q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  if(p > 1 - pl){ q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  q = p - .5; r = q * q;
  return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
}
// Expand trials into one row per active channel (scorable trials only)
function chanTrials(trials){
  const out = [];
  trials.forEach(x => {
    if(x.warmup) return;
    out.push({ch:'P', n:x.n, dual:x.dual, practice:x.practice, block:x.block, target:x.posTarget === 1, lure:x.posLure === 1, resp:x.posResp === 1, rt:x.posRT, correct:x.posCorrect === 1});
    if(x.dual) out.push({ch:'S', n:x.n, dual:x.dual, practice:x.practice, block:x.block, target:x.symTarget === 1, lure:x.symLure === 1, resp:x.symResp === 1, rt:x.symRT, correct:x.symCorrect === 1});
  });
  return out;
}
function sdt(cs){
  const T = cs.filter(c => c.target), NT = cs.filter(c => !c.target);
  if(!T.length || !NT.length) return {hit:null, fa:null, dprime:null};
  const hits = T.filter(c => c.resp).length, fas = NT.filter(c => c.resp).length;
  const H = (hits + .5) / (T.length + 1), F = (fas + .5) / (NT.length + 1);
  return {hit:hits / T.length, fa:fas / NT.length, dprime: invNorm(H) - invNorm(F), nT:T.length, nN:NT.length};
}
const condKey = c => `${c.n}|${c.dual ? 'd' : 's'}|${c.ch}`;
function summarize(trials){
  const cs = chanTrials(trials).filter(c => !c.practice);
  const all = sdt(cs);
  const hitRT = cs.filter(c => c.target && c.resp && c.rt !== '' && c.rt >= 150).map(c => c.rt);
  const nonT = cs.filter(c => !c.target);
  const lures = nonT.filter(c => c.lure), plain = nonT.filter(c => !c.lure);
  const conds = {};
  cs.forEach(c => { (conds[condKey(c)] = conds[condKey(c)] || []).push(c); });
  const cond = {};
  Object.entries(conds).forEach(([k, v]) => { const s = sdt(v); if(s.nT >= 3 && s.nN >= 3) cond[k] = s.dprime; });
  const g = k => cond[k] ?? null;
  return {
    n: trials.filter(x => !x.warmup && !x.practice).length,
    acc: cs.length ? cs.filter(c => c.correct).length / cs.length : null,
    dprime: all.dprime, hitRate: all.hit, faRate: all.fa,
    rtMedian: median(hitRT), rtMean: mean(hitRT),
    lureFA: lures.length ? lures.filter(c => c.resp).length / lures.length : null,
    nonLureFA: plain.length ? plain.filter(c => c.resp).length / plain.length : null,
    cond,
    dP1: g('1|s|P'), dP2: g('2|s|P'), dP2d: g('2|d|P'), dS2d: g('2|d|S'), dP3d: g('3|d|P'), dS3d: g('3|d|S'),
    dualCost: g('2|s|P') !== null && g('2|d|P') !== null ? g('2|s|P') - g('2|d|P') : null
  };
}

const fmtMs = v => v === null || v === undefined ? '–' : Math.round(v).toLocaleString() + ' ms';
const fmtPct = v => v === null || v === undefined ? '–' : (100 * v).toFixed(1) + '%';
const fmtDp = v => v === null || v === undefined ? '–' : v.toFixed(2);

function finishRun(r){
  RUN = null; TRIAL = null; RNG = Math.random;
  const sum = summarize(r.trials);
  const prev = History.all().filter(x => (x.mode === 'research') === (r.mode === 'research')).slice(-5);
  let newBest = false;
  if(r.mode === 'arcade'){
    const best = +store.get('eg-best', '0');

    if(r.maxN > +store.get('eg-bestN', '0')) store.set('eg-bestN', String(r.maxN));
  }
  if(r.mode === 'daily'){
    const log = dailyLog(); const d = log[r.date] || {best:0, plays:0};
    if(r.score > d.best){ d.best = r.score; newBest = d.plays > 0; }
    d.plays++; log[r.date] = d; store.put('eg-daily', log);
  }
  History.add({ts:Date.now(), date:todayKey(), mode:r.mode, score:r.score || 0, level:r.level || '', maxN: r.mode === 'arcade' ? r.maxN : null, n:sum.n,
    acc:sum.acc, dprime:sum.dprime, rtMedian:sum.rtMedian, lureFA:sum.lureFA});
  LAST = {r, sum, newBest, prev, save: r.mode === 'research' ? 'saving' : null, board:{state:'idle'}};
  renderResults(LAST); show('results');
  if(r.mode === 'research') saveRun(LAST);
  else if(getName() && Backend.online()) submitBoard(LAST);
}
function deltaHTML(L){
  const {sum, prev} = L;
  if(!prev.length) return `<span>${t('firstRun')}</span>`;
  const avg = k => mean(prev.map(x => x[k]).filter(v => v !== null && v !== undefined));
  const items = [];
  const a = avg('acc'); if(a !== null && sum.acc !== null){ const d = (sum.acc - a) * 100; items.push([t('d_acc'), (d >= 0 ? '+' : '') + d.toFixed(1) + ' pt', d > .5 ? 'up' : d < -.5 ? 'down' : '']); }
  const dp = avg('dprime'); if(dp !== null && sum.dprime !== null){ const d = sum.dprime - dp; items.push([t('d_dp'), (d >= 0 ? '+' : '') + d.toFixed(2), d > .05 ? 'up' : d < -.05 ? 'down' : '']); }
  const rt = avg('rtMedian'); if(rt !== null && sum.rtMedian !== null){ const d = sum.rtMedian - rt; items.push([t('d_rt'), (d > 0 ? '+' : '') + Math.round(d) + ' ms', d < -5 ? 'up' : d > 5 ? 'down' : '']); }
  return `<span>${t('vsPrev', prev.length)}</span>` + items.map(([k, v, c]) => `<span class="delta ${c}">${h(k)} ${h(v)}</span>`).join('');
}
function renderResults(L){
  const {r, sum} = L, mode = r.mode;
  $('#res-eyebrow').textContent = mode === 'arcade' ? `${t('arcadeRes')} ${r.level}` : mode === 'daily' ? t('dailyEyebrow', fmtDate(r.date)) : `${t('researchRes')} · ${r.pid} · ${r.session}`;

  $('#res-chart').innerHTML = chartSVG(sum);
  const bb = $('#res-board');
  bb.hidden = mode === 'research' || !Backend.online();

  if(!bb.hidden){
    if(document.activeElement !== $('#res-name')) $('#res-name').value = $('#res-name').value || getName();

    rk.textContent = st === 'sending' ? t('sending') : st === 'done' ? t('rankIs', L.board.rank, L.board.total, mode) : st === 'error' ? t('sendFail') : st === 'noname' ? t('needName') : '';
  }
  const stEl = $('#res-status');
  if(L.save){ stEl.hidden = false; stEl.className = 'status' + (L.save === 'saved' ? ' ok' : L.save === 'saving' ? '' : ' err'); stEl.textContent = t(L.save); }
  else stEl.hidden = true;
}
function chartSVG(sum){
  const items = Object.entries(sum.cond).map(([k, v]) => { const [n, d, ch] = k.split('|'); return {n:+n, d, ch, v}; })
    .sort((a, b) => a.n - b.n || (a.d === b.d ? 0 : a.d === 's' ? -1 : 1) || (a.ch === 'P' ? -1 : 1));
  if(!items.length) return `<div class="empty">–</div>`;
  const step = 92, pl = 36, pb = 44, pt = 22, H = 230, W = pl + 10 + step * items.length;
  const hi = Math.max(3, Math.ceil(Math.max(...items.map(x => x.v)))), lo = Math.min(0, Math.floor(Math.min(...items.map(x => x.v))));
  const y = v => pt + (H - pt - pb) * (hi - v) / (hi - lo);
  const bw = 52;
  // drawn at natural size (never stretched); the box scrolls sideways on narrow screens
  let s = `<div class="chartscroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="d′">`;
  for(let v = lo; v <= hi; v++) s += `<line class="${v === 0 ? 'zero' : 'grid'}" x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  items.forEach((it, i) => {
    const cx = pl + step * i + step / 2, top = y(Math.max(0, it.v)), bot = y(Math.min(0, it.v));
    s += `<rect class="bar ${it.ch === 'S' ? 's' : ''}" x="${cx - bw / 2}" y="${top}" width="${bw}" height="${Math.max(1, bot - top)}" rx="4"/>`;
    s += `<text class="vlab" x="${cx}" y="${top - 6}" text-anchor="middle">${it.v.toFixed(2)}</text>`;
    s += `<text x="${cx}" y="${H - pb + 17}" text-anchor="middle" style="font-family:var(--f-display);font-size:12px;fill:var(--fg)">${it.n}-back${it.d === 'd' ? ' ×2' : ''}</text>`;
    s += `<text x="${cx}" y="${H - pb + 32}" text-anchor="middle" style="font-family:var(--f-body);font-size:11px">${t(it.ch === 'P' ? 'c_pos' : 'c_sym')}</text>`;
  });
  return s + '</svg></div>';
}

const esc = v => { if(v === null || v === undefined) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

    `<td>${(+r.score).toLocaleString()}</td>` + (LB_TAB === 'arcade' ? `<td>${h(r.level)}</td><td>${r.maxN ? h(r.maxN) : '–'}</td>` : '') + `<td>${pc(r.acc)}</td></tr>`).join('');
}

/* ---------------- progress screen ---------------- */
function lineChart(points, key, fmt, lowerBetter){
  const pts = points.filter(p => p[key] !== null && p[key] !== undefined && p[key] !== '').slice(-30);
  if(pts.length < 2) return `<div class="empty">${t('p_need')}</div>`;
  const W = 320, H = 150, pl = 40, pr = 34, pt = 14, pb = 18;
  const vals = pts.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi - lo < 1e-9){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * .15; lo -= pad; hi += pad;
  const x = i => pl + (W - pl - pr) * (i / (pts.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(v => { s += `<line class="grid" x1="${pl}" x2="${W - pr + 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; });
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');
  s += `<path class="area" d="${d} L${x(pts.length - 1)},${H - pb} L${x(0)},${H - pb} Z"/><path class="ln" d="${d}"/>`;
  pts.forEach((p, i) => { if(i < pts.length - 1) s += `<circle class="dot ${p.mode}" cx="${x(i)}" cy="${y(p[key])}" r="3"><title>${new Date(p.ts).toLocaleDateString()} · ${p.mode} · ${fmt(p[key])}</title></circle>`; });
  const lx = x(pts.length - 1), ly = y(vals[vals.length - 1]);
  s += `<circle class="end" cx="${lx}" cy="${ly}" r="5"/><text class="vlab" x="${lx + 7}" y="${ly + 4}">${fmt(vals[vals.length - 1])}</text>`;
  s += '</svg>';
  const first = mean(vals.slice(0, Math.min(5, vals.length - 1))), last = vals[vals.length - 1];
  const diff = last - first, good = lowerBetter ? diff < 0 : diff > 0;
  return s + `<div class="sub">${t('p_trend', fmt(Math.abs(diff)), good)}</div>`;
}
function renderProgress(){
  const all = History.all();
  const arc = all.filter(x => x.mode === 'arcade');
  const ns = arc.map(x => x.maxN).filter(v => v);
  $('#prog-tiles').innerHTML = [
    ['p_runs', all.length.toLocaleString()], ['p_best', arc.length ? Math.max(...arc.map(x => x.score)).toLocaleString() : '–'],
    ['p_streak', dailyStreak() + ' ' + t('days', dailyStreak())], ['p_bestN', ns.length ? Math.max(...ns) + '-back' : '–']
  ].map(([k, v]) => `<div class="tile"><div class="k">${t(k)}</div><div class="v">${v}</div></div>`).join('');
  const pts = all.map(x => ({...x, nA: x.mode === 'arcade' ? x.maxN : null}));
  $('#prog-charts').innerHTML = [
    ['pc_dp', 'dprime', v => v.toFixed(2), false, 'pc_higher'],
    ['pc_rt', 'rtMedian', v => Math.round(v) + '', true, 'pc_lower'],
    ['pc_n', 'nA', v => v.toFixed(v % 1 ? 1 : 0), false, 'pc_higher']
  ].map(([title, key, fmt, lower, note]) => `<div class="chartbox"><h3>${t(title)}</h3><div class="sub">${t(note)}</div>${lineChart(pts, key, fmt, lower)}</div>`).join('');
}
