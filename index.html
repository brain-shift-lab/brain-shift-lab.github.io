<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#121120">
<meta property="og:title" content="Signal Shift — เกมสลับกฎฝึกสมอง">
<meta property="og:description" content="กรอบบอกกฎ สัญญาณบอกคำตอบ กด F หรือ J ให้ไวที่สุด มีภารกิจประจำวันและตารางอันดับ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">

<style>
/* Layout: one-screen arcade cabinet — a cue frame around a single stimulus, HUD above, response pads below. Deliberately single dark look. */
:root{
  color-scheme: dark;
  --bg:#121120; --panel:#1B1A2D; --panel2:#24223A; --line:#322F4F;
  --fg:#EEEAFE; --muted:#A29DC8; --accent:#C4B5FF;
  --good:#5FE0B2; --hot:#FF5470; --blue:#4F8CFF; --orange:#FF9D42;
  --f-display:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 0,var(--bg) 75%);pointer-events:none;z-index:0}
body.boss-on::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,var(--hot) 160%);opacity:.35;animation:bosspulse 1.1s ease-in-out infinite}
@keyframes bosspulse{50%{opacity:.6}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
button,input{font:inherit;color:inherit}
kbd{font-family:var(--f-mono);font-size:.85em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;max-width:1040px;width:100%;margin-inline:auto}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
.brand b{color:var(--fg)}
.tb-actions{display:flex;gap:8px}
.chipbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-weight:600;letter-spacing:.04em}
.chipbtn:hover,.chipbtn[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}

main{flex:1;display:flex;max-width:1040px;width:100%;margin-inline:auto;padding-block:8px 28px}
.screen{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;cursor:pointer;border:1px solid var(--line);background:var(--panel);transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.primary:hover{background:var(--fg)}
.btn.daily{border-color:var(--orange)}
.btn small{font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.75;text-align:right}
.btn.sm{padding:9px 14px;font-size:14px}

/* title */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(52px,9vw,104px);line-height:.86;letter-spacing:-.01em;margin:14px 0 18px}
.logo span{display:block}
.logo .s2{color:transparent;-webkit-text-stroke:2px var(--accent);padding-left:.5em}
.tagline{color:var(--muted);max-width:44ch;font-size:16px;margin:0 0 20px;text-wrap:balance}
.menu{display:flex;flex-direction:column;gap:10px;max-width:400px}
.menu .btn{justify-content:space-between}
.menu-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menu-row .btn{justify-content:center;padding:10px 8px;font-size:14px}
.best{margin-top:16px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.best b{color:var(--fg);font-family:var(--f-mono)}
.demo{position:relative;aspect-ratio:1;max-width:100%;width:100%}
.demo-cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.constructs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}

/* stage */
.stage-wrap{position:relative;width:min(100%,380px);margin-inline:auto}
.cue{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-align:center;font-size:20px;height:30px;transition:opacity .1s}
.cue.r-color{color:var(--orange)}
.cue.r-shape{color:var(--fg)}
.cue.r-memory{color:var(--accent)}
svg.stage{width:100%;height:auto;display:block;overflow:visible}
.stage-wrap canvas{position:absolute;inset:30px 0 0 0;width:100%;height:calc(100% - 30px);pointer-events:none}
.flash-good .frame-el{filter:drop-shadow(0 0 14px var(--good))}
.flash-bad .frame-el{filter:drop-shadow(0 0 14px var(--hot))}
.shake{animation:shake .28s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fbtext{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--f-display);font-weight:700;font-size:24px;pointer-events:none;opacity:0;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
.fbtext.on{animation:rise .6s ease-out}
@keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}

/* game */
#scr-game{display:flex;flex-direction:column;gap:12px}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:stretch}
.hud .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.hud .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .val{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.pips{display:flex;gap:4px;padding-top:6px}
.pip{width:12px;height:12px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--good)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#scr-game.boss .progress{height:10px}
#scr-game.boss .progress i{background:var(--hot)}
#scr-game.boss .hud .cell{border-color:var(--hot)}
.bossbar{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;color:var(--hot);font-size:13px;margin-bottom:-6px}
.legend{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:420px;width:100%;margin-inline:auto;min-height:28px;font-size:14px;color:var(--muted)}
.legend .l{text-align:right}.legend .mid{font-family:var(--f-mono);font-size:12px;opacity:.6}
.legend b{color:var(--fg);font-weight:600}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;width:100%;margin-inline:auto}
.pad{height:76px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-display);font-weight:700;font-size:22px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad:active,.pad.hit{background:var(--panel2);border-color:var(--accent)}
.pad small{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted)}
.meta-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);max-width:420px;width:100%;margin-inline:auto}
.quit{background:none;border:1px solid var(--line);border-radius:10px;color:var(--muted);padding:0 12px;cursor:pointer;font-size:13px}
.quit:hover{color:var(--hot);border-color:var(--hot)}

/* panels / inter / setup */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:640px;margin-inline:auto}
.panel.boss{border-color:var(--hot)}
.panel.boss .eyebrow{color:var(--hot)}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.panel p{color:var(--muted);margin:0 0 14px}
.notice{font-family:var(--f-display);font-weight:600;color:var(--good);margin-bottom:10px}
.notice.bad{color:var(--hot)}
.rulechips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.rchip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.rchip svg{width:26px;height:26px}
.rchip.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px;color:var(--fg)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.protocol{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 18px}
.protocol td{padding:6px 0;border-bottom:1px solid var(--line)}
.protocol td:last-child{text-align:right;font-family:var(--f-mono);color:var(--muted)}

/* how to */
.howgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.howcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;min-width:0}
.howcard h3{font-family:var(--f-display);font-size:18px;margin:0 0 4px;letter-spacing:.04em}
.howcard p{margin:0;color:var(--muted);font-size:14px}
.howcard .measure{display:block;margin-top:8px;font-size:12px;font-family:var(--f-mono);color:var(--accent)}
.howcard svg{width:72px;height:72px}
.pagehead h2{font-family:var(--f-display);font-size:34px;margin:6px 0 6px;line-height:1.1}
.pagehead p{color:var(--muted);margin:0;max-width:62ch}

/* results */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;margin:2px 0;overflow-wrap:anywhere}
.tile .n{font-size:12px;color:var(--muted);line-height:1.4}
.tile.lead{border-color:var(--accent)}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.chartbox h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px;letter-spacing:.04em}
.chartbox .sub{font-size:12px;color:var(--muted);margin:-4px 0 6px}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .bar{fill:var(--accent)}
.chart .bar.sw{fill:var(--orange)}
.chart .bar.mem{fill:var(--good)}
.chart .grid{stroke:var(--line)}
.chart .vlab{fill:var(--fg)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .area{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.chart .dot.daily{stroke:var(--orange)}
.chart .dot.research{stroke:var(--good)}
.chart .end{fill:var(--accent)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.ok::before{background:var(--good)}
.status.err::before{background:var(--hot)}
textarea.csv{width:100%;height:120px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-family:var(--f-mono);font-size:11px;padding:8px;box-sizing:border-box}
.res-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px}
.res-head h2{font-family:var(--f-display);font-size:34px;margin:4px 0 0}
.bigscore{font-family:var(--f-mono);font-size:40px;color:var(--accent)}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;font-size:13px;color:var(--muted)}
.delta{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.delta.up{border-color:var(--good);color:var(--good)}
.delta.down{border-color:var(--hot);color:var(--hot)}
.boardbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.boardbox .lab{font-family:var(--f-display);font-weight:600}
.boardbox input{width:180px}
.rank{font-family:var(--f-display);font-weight:700;color:var(--orange)}

/* tables */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:16px}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
table.data.lb{min-width:0}
table.data th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data td.name{font-family:var(--f-body);white-space:normal;overflow-wrap:anywhere}
table.data tr:last-child td{border-bottom:0}
table.data tr.me td{background:var(--panel2);color:var(--accent)}
table.data td.r1{color:var(--orange);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.namebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.namebar input{width:200px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:20px}
  .demo-col{order:-1;max-width:240px;margin-inline:auto;width:100%}
  .howgrid{grid-template-columns:1fr}
  .tiles,.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:1fr}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
  .hud .cell.hide-sm{display:none}
  .panel{padding:20px}
  .menu{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .shake{animation:none}.fbtext.on{animation:none;opacity:0}
  .btn,.btn:hover{transition:none;transform:none}
  body.boss-on::after{animation:none}
}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="brand" type="button">SIGNAL <b>SHIFT</b></button>
    <div class="tb-actions">
      <button class="chipbtn" id="sound-btn" type="button"></button>
      <button class="chipbtn" id="lang-btn" type="button">EN</button>
    </div>
  </header>

  <main>
    <!-- TITLE -->
    <section class="screen" id="scr-title">
      <div class="hero">
        <div>
          <div class="eyebrow" data-i="eyebrow"></div>
          <h1 class="logo"><span>SIGNAL</span><span class="s2">SHIFT</span></h1>
          <p class="tagline" data-i="tagline"></p>
          <div class="constructs" id="constructs"></div>
          <div class="menu">
            <button class="btn primary" id="go-arcade" type="button"><span data-i="playArcade"></span><small data-i="playArcadeSub"></small></button>
            <button class="btn daily" id="go-daily" type="button"><span data-i="daily"></span><small id="daily-sub"></small></button>
            <button class="btn" id="go-research" type="button"><span data-i="research"></span><small data-i="researchSub"></small></button>
            <div class="menu-row">
              <button class="btn" id="go-board" type="button" data-i="board"></button>
              <button class="btn" id="go-progress" type="button" data-i="progress"></button>
              <button class="btn" id="go-how" type="button" data-i="how"></button>
            </div>
            <button class="btn" id="go-data" type="button" hidden><span data-i="dataBtn"></span><small data-i="dataSub"></small></button>
          </div>
          <div class="best" id="title-stats"></div>
        </div>
        <div class="demo-col">
          <div class="stage-wrap demo">
            <div class="cue" id="demo-cue"></div>
            <svg class="stage" id="demo-svg" viewBox="0 0 300 300" aria-hidden="true"></svg>
          </div>
          <div class="demo-cap" id="demo-cap"></div>
        </div>
      </div>
    </section>

    <!-- HOW -->
    <section class="screen" id="scr-how" hidden>
      <div class="pagehead"><div class="eyebrow" data-i="how"></div><h2 data-i="howTitle"></h2><p data-i="howIntro"></p></div>
      <div class="howgrid" id="howgrid"></div>
      <div class="actions"><button class="btn primary" id="how-play" type="button" data-i="playArcade"></button><button class="btn" id="how-back" type="button" data-i="back"></button></div>
    </section>

    <!-- RESEARCH SETUP -->
    <section class="screen" id="scr-setup" hidden>
      <div class="panel">
        <div class="eyebrow" data-i="research"></div>
        <h2 data-i="setupTitle"></h2>
        <p data-i="setupIntro"></p>
        <div class="field"><label for="pid" data-i="pid"></label><input type="text" id="pid" autocomplete="off" maxlength="40" data-ph="pidPh"></div>
        <div class="field"><label for="sess" data-i="sess"></label><input type="text" id="sess" autocomplete="off" maxlength="40" value="S1"></div>
        <label class="check"><input type="checkbox" id="fb" checked><span data-i="fbOpt"></span></label>
        <label class="check"><input type="checkbox" id="consent"><span data-i="consent"></span></label>
        <table class="protocol" id="protocol"></table>
        <div class="actions"><button class="btn primary" id="setup-start" type="button" disabled data-i="startTest"></button><button class="btn" id="setup-back" type="button" data-i="back"></button></div>
        <div class="hint" data-i="kbHint"></div>
      </div>
    </section>

    <!-- GAME -->
    <section class="screen" id="scr-game" hidden>
      <div class="hud">

/* ---------------- random (seedable for the daily challenge) ---------------- */
let RNG = Math.random;
const rand = () => RNG();
const pick = a => a[Math.floor(rand() * a.length)];
function seeded(str){
  let hsh = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ hsh = Math.imul(hsh ^ str.charCodeAt(i), 3432918353); hsh = hsh << 13 | hsh >>> 19; }
  let a = hsh >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}

/* ---------------- sound ---------------- */
let SOUND = store.get('ss-sound', '1') === '1';
let AC = null;
function ac(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){} return AC; }
function toneAt(t0, freq, dur = .08, type = 'square', vol = .04){
  if(!SOUND || !AC) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  }catch(e){}
}
function tone(freq, dur, type, vol, when = 0){ if(!SOUND) return; ac(); if(AC) toneAt(AC.currentTime + when, freq, dur, type, vol); }
const sfx = {
  good(m){ tone(520 + m * 40, .07, 'square', .035); tone(780 + m * 40, .08, 'square', .03, .05); },
  bad(){ tone(140, .2, 'sawtooth', .05); },
  level(){ [440, 554, 659, 880].forEach((f, i) => tone(f, .1, 'square', .035, i * .08)); },
  over(){ [330, 262, 196].forEach((f, i) => tone(f, .18, 'triangle', .06, i * .15)); },
  boss(){ [880, 660, 880, 660, 1100].forEach((f, i) => tone(f, .12, 'sawtooth', .04, i * .1)); }
};
// Boss music: a looping bass + arpeggio that speeds up as the boss loses health
const Music = {
  timer:null, step:0, tempo:124, next:0,
  start(){ if(!SOUND) return; ac(); if(!AC) return; this.stop(); this.step = 0; this.tempo = 124; this.next = AC.currentTime + .08; this.timer = setInterval(() => this.tick(), 30); },
  tick(){ if(!AC) return; while(this.next < AC.currentTime + .12){ this.play(this.step, this.next); this.next += 60 / this.tempo / 2; this.step++; } },
  play(i, at){
    const roots = [55, 55, 65.4, 49];
    const root = roots[Math.floor(i / 8) % 4];
    if(i % 2 === 0) toneAt(at, root, .14, 'sawtooth', .05);
    const arp = [4, 3, 2, 3][i % 4];
    toneAt(at, root * arp * 2, .06, 'square', .018);
    if(i % 4 === 2) toneAt(at, 3000, .02, 'square', .01);
  },
  stop(){ clearInterval(this.timer); this.timer = null; }
};

/* ---------------- stimulus drawing ---------------- */
const COLORS = ['blue', 'orange'], SHAPES = ['circle', 'triangle'];
function glyph(stim){
  const fill = stim.color === 'blue' ? 'var(--blue)' : 'var(--orange)';
  let g = stim.shape === 'circle'
    ? `<circle cx="150" cy="150" r="54" style="fill:${fill}"/>`
    : `<polygon points="150,88 210,192 90,192" style="fill:${fill}" stroke-linejoin="round" stroke-width="10" stroke="${fill}"/>`;
  if(stim.nogo) g += `<circle cx="150" cy="150" r="88" fill="none" style="stroke:var(--hot)" stroke-width="7" stroke-dasharray="14 10"/>`;
  return g;
}
// Two-tone frame drawn as two half-paths (no gradient ids, so it renders in every SVG on the page)
const SPLIT_FRAME = `<g class="frame-el" fill="none" stroke-width="8" stroke-linecap="butt">` +
  `<path d="M150,14 H44 A30,30 0 0 0 14,44 V256 A30,30 0 0 0 44,286 H150" style="stroke:var(--blue)"/>` +
  `<path d="M150,14 H256 A30,30 0 0 1 286,44 V256 A30,30 0 0 1 256,286 H150" style="stroke:var(--orange)"/></g>`;
function frame(rule){
  if(rule === 'color') return SPLIT_FRAME;
  if(rule === 'shape') return `<rect class="frame-el" x="14" y="14" width="272" height="272" rx="30" fill="none" style="stroke:var(--fg)" stroke-width="8"/>`;
  if(rule === 'memory') return `<g class="frame-el"><rect x="10" y="10" width="280" height="280" rx="32" fill="none" style="stroke:var(--accent)" stroke-width="4"/><rect x="24" y="24" width="252" height="252" rx="22" fill="none" style="stroke:var(--accent)" stroke-width="4"/></g>`;
  return `<rect class="frame-el" x="14" y="14" width="272" height="272" rx="30" fill="none" style="stroke:var(--line)" stroke-width="4" stroke-dasharray="4 10"/>`;
}
function drawStage(svg, rule, stim, fix){
  svg.innerHTML = `<rect x="14" y="14" width="272" height="272" rx="30" style="fill:var(--panel)" opacity=".7"/>` + frame(rule) +
    (stim ? glyph(stim) : '') + (fix ? `<circle cx="150" cy="150" r="5" style="fill:var(--muted)"/>` : '');
}
function miniSVG(kind){
  const map = {
    color: frame('color') + glyph({color:'blue', shape:'circle'}),
    shape: frame('shape') + glyph({color:'orange', shape:'triangle'}),
    memory: frame('memory') + glyph({color:'blue', shape:'triangle'}),
    stop: frame('color') + glyph({color:'orange', shape:'circle', nogo:true}),
    switch: SPLIT_FRAME + `<rect x="54" y="54" width="192" height="192" rx="20" fill="none" style="stroke:var(--fg)" stroke-width="8"/>`,
    over: frame('memory') + glyph({color:'orange', shape:'triangle', nogo:true})
  };
  return `<svg viewBox="0 0 300 300" aria-hidden="true">${map[kind] || ''}</svg>`;
}
const keyFor = {
  color: s => s.color === 'blue' ? 'L' : 'R',
  shape: s => s.shape === 'circle' ? 'L' : 'R',
  memory: (s, p) => (p && p.color === s.color && p.shape === s.shape) ? 'L' : 'R'
};

/* ---------------- storage backends ----------------
   sheets : Google Apps Script web app (public website build, see config.js)
   claude : the artifact's own database (inside claude.ai)
   local  : this device only                                            */
let DB = null, UID = null, CAN_EDIT = false, DL = null;
const Backend = {
  kind: CFG.backendUrl ? 'sheets' : 'local',
  online(){ return this.kind !== 'local'; },
  async sheetsGet(params){
    const u = new URL(CFG.backendUrl);
    Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
    const r = await fetch(u.toString(), {method:'GET'});
    const j = await r.json(); if(!j.ok) throw new Error(j.error || 'backend'); return j;
  },
  async sheetsPost(payload){
    const r = await fetch(CFG.backendUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
    const j = await r.json(); if(!j.ok) throw new Error(j.error || 'backend'); return j;
  },
  async submitScore(e){
    if(this.kind === 'sheets') return this.sheetsPost({action:'score', ...e});
    if(this.kind === 'claude'){
      const ref = DB.doc('board/' + UID);
      const cur = await ref.get();
      const d = cur.exists ? JSON.parse(JSON.stringify(cur.data())) : {daily:{}};
      d.name = e.name; d.updatedAt = new Date().toISOString(); d.daily = d.daily || {};
      if(e.mode === 'arcade'){ if(!d.arcade || e.score > d.arcade.score) d.arcade = {score:e.score, level:e.level, acc:e.acc}; }
      else { const p = d.daily[e.date]; if(!p || e.score > p.score) d.daily[e.date] = {score:e.score, acc:e.acc}; }
      Object.keys(d.daily).sort().slice(0, -14).forEach(k => delete d.daily[k]);
      await ref.set(d);
      const lb = await this.leaderboard(e.mode, e.date);
      const idx = lb.rows.findIndex(r => r.me);
      return {ok:true, rank: idx + 1, total: lb.rows.length};
    }
    throw new Error('offline');
  },
  async leaderboard(kind, date){
    if(this.kind === 'sheets') return this.sheetsGet({action:'leaderboard', kind, date, device:DEVICE});
    if(this.kind === 'claude'){
      const snap = await DB.collection('board').get();
      const rows = [];
      snap.docs.forEach(doc => {
        const d = doc.data() || {};
        const s = kind === 'arcade' ? d.arcade : (d.daily || {})[date];
        if(s && typeof s.score === 'number') rows.push({name:d.name || '?', score:s.score, level:s.level ?? '', acc:s.acc ?? '', me: doc.id === UID});
      });
      rows.sort((a, b) => b.score - a.score);
      return {ok:true, rows:rows.slice(0, 50)};
    }
    throw new Error('offline');
  },
  async saveResearch(meta, row, trials){
    if(this.kind === 'sheets') return this.sheetsPost({action:'research', summary:row, trials});
    if(this.kind === 'claude'){
      await DB.doc(`sessions/${UID}/runs/${meta.runId}`).set({...row, trials, version:1});
      const idx = DB.doc(`sessions/${UID}`);
      const cur = await idx.get();
      const runs = cur.exists && Array.isArray(cur.data().runs) ? [...cur.data().runs] : [];
      runs.push(row);
      await idx.set({runs:runs.slice(-200), updatedAt:new Date().toISOString()});
      return {ok:true};
    }
    throw new Error('offline');
  }
};
(async () => {
  if(Backend.kind === 'sheets' || !window.claude || !window.claude.use) return;
  try{
    const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);

    if(DB && UID) Backend.kind = 'claude';
    $('#go-data').hidden = !(DB && CAN_EDIT);

  }catch(e){}
})();

}

/* ---------------- fx ---------------- */
const fx = $('#fx'), fxc = fx.getContext('2d');
let parts = [], fxOn = false;
function burst(color, n = 22){
  if(REDUCED) return;
  const rect = fx.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  fx.width = rect.width * dpr; fx.height = rect.height * dpr;
  const col = getComputedStyle(document.documentElement).getPropertyValue(color).trim();
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
    parts.push({x:fx.width / 2, y:fx.height / 2, vx:Math.cos(a) * s * dpr, vy:Math.sin(a) * s * dpr, life:1, col, sz:(2 + Math.random() * 3) * dpr});
  }
  if(!fxOn){ fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fxc.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= .95; p.vy *= .95; p.life -= .03;
    fxc.globalAlpha = Math.max(0, p.life); fxc.fillStyle = p.col; fxc.fillRect(p.x, p.y, p.sz, p.sz); });
  fxc.globalAlpha = 1;
  if(parts.length) requestAnimationFrame(fxLoop); else fxOn = false;
}
function feedback(ok, text, color){
  const w = $('#stage-wrap'), ft = $('#fbtext');
  w.classList.remove('flash-good', 'flash-bad', 'shake'); void w.offsetWidth;
  w.classList.add(ok ? 'flash-good' : 'flash-bad'); if(!ok && !REDUCED) w.classList.add('shake');
  ft.textContent = text; ft.style.color = `var(${color})`;
  ft.classList.remove('on'); void ft.offsetWidth; ft.classList.add('on');
}

/* ---------------- trial engine ---------------- */
const DAILY_DEADLINE = 1400;
function nextRule(cfg, prev, i){
  const pool = cfg.rules;
  if(pool.length === 1) return pool[0];
  if(i === 0 || !prev) return pick(pool.filter(r => r !== 'memory'));
  if(rand() < (cfg.switchP ?? .5)) return pick(pool.filter(r => r !== prev));
  return prev;
}
function makeStim(rule, prev, cfg, i, prevNogo){
  let color, shape;
  if(rule === 'memory' && prev && rand() < .38){ color = prev.color; shape = prev.shape; }
  else {
    do { color = pick(COLORS); shape = pick(SHAPES); }
    while(rule === 'memory' && prev && color === prev.color && shape === prev.shape);
  }
  const roll = rand();
  const nogo = i > 0 && !prevNogo && roll < (cfg.nogo || 0) * 1.15;
  return {color, shape, nogo};
}

async function runBlock(r, cfg, blockIdx){
  const S = $('#stage'), cue = $('#cue');
  const scored = r.mode !== 'research';
  r.cfg = cfg; r.ti = 0; r.blockN = cfg.n; setHudLabels();
  let prevRule = null, prevStim = null, prevNogo = null;
  const memOnly = cfg.rules.length === 1 && cfg.rules[0] === 'memory';
  for(let i = 0; i < cfg.n; i++){
    alive(r);
    const rule = nextRule(cfg, prevRule, i);
    const warm = memOnly && i === 0;
    const stim = makeStim(rule, prevStim, cfg, i, prevNogo);
    if(warm) stim.nogo = false;
    const jitter = rand();
    let cti, iti, deadline;
    if(r.mode === 'arcade'){
      cti = Math.max(200, 650 - (r.level - 1) * 60) - (cfg.boss ? 120 : 0);
      iti = 350 + jitter * 200;
      deadline = Math.round(cfg.boss ? Math.max(420, r.deadline * .9) : r.deadline);
    } else if(r.mode === 'daily'){ cti = 450; iti = 350 + jitter * 200; deadline = DAILY_DEADLINE; }
    else { cti = 500; iti = 500; deadline = r.deadline; }
    r.curDeadline = deadline;
    cue.textContent = ''; cue.className = 'cue';
    drawStage(S, null, null, true); setLegend(null);
    await wait(iti); alive(r);
    cue.textContent = t('r_' + rule); cue.className = 'cue r-' + rule;
    drawStage(S, rule, null, true);
    setLegend(rule, r.mode === 'research' ? true : cfg.legend, warm);
    await wait(cti); alive(r);
    if(PENDING) PENDING(null);
    drawStage(S, rule, stim, false);
    await frameTick();
    const onset = performance.now();
    const resp = await waitResponse(warm ? 1200 : deadline);
    alive(r);
    const correctResp = warm ? 'none' : stim.nogo ? 'none' : keyFor[rule](stim, prevStim);
    const given = resp ? resp.key : 'none';
    const rt = resp ? Math.round(resp.t - onset) : null;
    const correct = warm ? true : given === correctResp;
    const sw = cfg.rules.length === 1 ? 'pure' : (prevRule === null ? 'first' : rule === prevRule ? 'repeat' : 'switch');
    r.trials.push({
      pid:r.pid || '', session:r.session || '', mode:r.mode, block:cfg.key, blockIdx, trial:i + 1, level:r.level || '',
      rule, prevRule:prevRule || '', transition:sw, color:stim.color, shape:stim.shape, nogo:stim.nogo ? 1 : 0,
      congruent: rule === 'memory' ? '' : (keyFor.color(stim) === keyFor.shape(stim) ? 1 : 0),
      memMatch: rule === 'memory' && prevStim ? (prevStim.color === stim.color && prevStim.shape === stim.shape ? 1 : 0) : '',
      correctResp, resp:given, rt, correct: correct ? 1 : 0, timeout: (!resp && correctResp !== 'none') ? 1 : 0,
      deadline, cti, practice: cfg.practice ? 1 : 0, warmup: warm ? 1 : 0, ts: new Date().toISOString()
    });
    r.ti = i + 1;
    if(warm){ /* no feedback */ }
    else if(scored){
      if(correct){
        r.combo++; r.mult = Math.min(8, 1 + Math.floor(r.combo / 6));
        const pts = stim.nogo ? 150 * r.mult : (100 + Math.round(Math.max(0, deadline - rt) / 8)) * r.mult;
        r.score += pts; r.correct = (r.correct || 0) + 1;
        let label = (stim.nogo ? t('held') + ' ' : '') + '+' + pts;
        if(cfg.boss){
          const dmg = r.mult >= 4 ? 2 : 1;
          r.bossHp -= dmg; if(dmg === 2) label = t('crit') + ' ' + label;
          Music.tempo = 124 + 70 * (1 - Math.max(0, r.bossHp) / r.bossMax);
        }
        if(r.mode === 'arcade'){ r.streak++; if(r.streak >= 3){ r.deadline = Math.max(r.floor, r.deadline - 60); r.streak = 0; } }
        feedback(true, label, '--good'); burst(cfg.boss ? '--hot' : '--good', cfg.boss ? 34 : 22); sfx.good(r.mult);
      } else {
        r.combo = 0; r.mult = 1; r.streak = 0;
        if(r.mode === 'arcade'){ r.lives--; r.deadline = Math.min(2200, r.deadline + 120); }
        feedback(false, resp ? t('bad') : t('slow'), '--hot'); sfx.bad();
      }
      updateHud();
      await wait(correct ? 260 : 520); alive(r);
      if(r.mode === 'arcade' && r.lives <= 0) return 'over';
      if(cfg.boss && r.bossHp <= 0) return 'boss-win';
    } else {
      updateHud();
      if(r.feedback || cfg.practice){
        if(correct){ feedback(true, stim.nogo ? t('held') : t('good'), '--good'); sfx.good(1); }
        else { feedback(false, resp ? t('bad') : t('slow'), '--hot'); sfx.bad(); }
        await wait(correct ? 300 : 600); alive(r);
      }
    }
    prevRule = rule; prevStim = stim; prevNogo = stim.nogo;
  }
  return cfg.boss ? 'boss-escape' : 'done';
}

async function startArcade(){
  ac(); RNG = Math.random;
  const r = RUN = newRun({mode:'arcade', lives:3, level:1, deadline:1900, floor:1300, streak:0, bosses:0});
  let notice = null, noticeBad = false;
  try{
    for(;;){
      const cfg = arcadeLevel(r.level);
      r.floor = Math.max(480, 1300 - (r.level - 1) * 90);
      if(r.level > 5) r.deadline = Math.max(r.floor, Math.min(r.deadline, 1300 - (r.level - 6) * 70));
      const chips = [...cfg.rules]; if(cfg.nogo) chips.push('stop');
      const introKey = cfg.intro === 'over' ? 'lv_over' : cfg.intro ? 'lv_' + cfg.intro : null;
      const L = r.level;
      await interScreen({
        eyebrow: () => `${t('level')} ${L}` + (cfg.intro && cfg.intro !== 'over' && L > 1 ? ' · ' + t('newRule') : ''),
        title: () => introKey ? t(introKey)[0] : `${t('level')} ${L}`,
        body: () => (L > 1 && !notice ? t('lifeBack') + '. ' : '') + (introKey ? t(introKey)[1] : t('lv_over')[1]),
        chips, newKey: cfg.intro === 'switch' ? null : cfg.intro, notice, noticeBad
      });
      notice = null; alive(r);
      show('game');
      const res = await runBlock(r, cfg, r.level);
      if(res === 'over') break;
      r.score += 500 * r.level; r.lives = Math.min(5, r.lives + 1);
      sfx.level();
      if(r.level % 5 === 0){
        const n = r.level / 5, bc = bossConfig(n);
        await interScreen({
          eyebrow: () => t('bossEyebrow', n), title: () => t('bossNames')[(n - 1) % 4],
          body: () => t('bossBody'), chips:['color', 'shape', 'memory', 'stop'], boss:true,
          notice: t('lifeBack'), noticeBad:false
        });
        alive(r);
        r.bossHp = r.bossMax = bc.hp;
        $('#scr-game').classList.add('boss'); $('#bossbar').hidden = false; document.body.classList.add('boss-on');
        show('game'); sfx.boss(); setTimeout(() => { if(RUN === r) Music.start(); }, 500);
        const br = await runBlock(r, bc, bc.key);
        endBossFx();
        if(br === 'over') break;
        if(br === 'boss-win'){ const bonus = 3000 * n; r.score += bonus; r.lives = Math.min(5, r.lives + 2); r.bosses++; notice = t('bossWin', bonus); noticeBad = false; sfx.level(); }
        else { notice = t('bossEscape'); noticeBad = true; }
      }
      r.level++;
    }
    endBossFx(); sfx.over();
    finishRun(r);
  }catch(e){ endBossFx(); if(e !== ABORT) console.error(e); }
}

  const pl = .02425; let q, r;
  if(p < pl){ q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  if(p > 1 - pl){ q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  q = p - .5; r = q * q;
  return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
}
function summarize(trials){
  const T = trials.filter(x => !x.practice && !x.warmup);
  const go = T.filter(x => !x.nogo), ng = T.filter(x => x.nogo);
  const okRT = go.filter(x => x.correct && x.rt !== null && x.rt >= 150);
  const rtOf = f => mean(okRT.filter(f).map(x => x.rt));
  const cs = x => x.rule === 'color' || x.rule === 'shape';
  const csPrev = x => x.prevRule === 'color' || x.prevRule === 'shape';
  const pure = rtOf(x => x.transition === 'pure' && cs(x));
  const rep = rtOf(x => x.transition === 'repeat' && cs(x) && csPrev(x));
  const swi = rtOf(x => x.transition === 'switch' && cs(x) && csPrev(x));
  const cong = rtOf(x => cs(x) && x.congruent === 1);
  const inc = rtOf(x => cs(x) && x.congruent === 0);
  const mem = rtOf(x => x.rule === 'memory');
  const memT = go.filter(x => x.rule === 'memory' && x.memMatch !== '');
  let dprime = null;
  if(memT.length >= 6){
    const m = memT.filter(x => x.memMatch === 1), nm = memT.filter(x => x.memMatch === 0);
    if(m.length && nm.length){
      const H = (m.filter(x => x.resp === 'L').length + .5) / (m.length + 1);
      const F = (nm.filter(x => x.resp === 'L').length + .5) / (nm.length + 1);
      dprime = invNorm(H) - invNorm(F);
    }
  }
  return {
    n:T.length,
    acc: T.length ? T.filter(x => x.correct).length / T.length : null,
    rtMedian: median(okRT.map(x => x.rt)), rtMean: mean(okRT.map(x => x.rt)),
    pure, repeat:rep, switch:swi, congruent:cong, incongruent:inc, memory:mem,
    switchCost: (swi !== null && rep !== null) ? swi - rep : null,
    mixingCost: (rep !== null && pure !== null) ? rep - pure : null,
    congruency: (inc !== null && cong !== null) ? inc - cong : null,
    commission: ng.length ? ng.filter(x => x.resp !== 'none').length / ng.length : null,
    nogoN: ng.length,
    omission: go.length ? go.filter(x => x.timeout).length / go.length : null,
    dprime
  };
}

const fmtDiff = v => v === null || v === undefined ? '–' : (v > 0 ? '+' : '') + Math.round(v) + ' ms';
const fmtPct = v => v === null || v === undefined ? '–' : (100 * v).toFixed(1) + '%';
const fmtDp = v => v === null || v === undefined ? '–' : v.toFixed(2);

function finishRun(r){
  RUN = null; RNG = Math.random;
  const sum = summarize(r.trials);
  const prev = History.all().filter(x => x.mode !== 'research' || r.mode === 'research').slice(-5);
  let newBest = false;
  if(r.mode === 'arcade'){
    const best = +store.get('ss-best', '0');
    if(r.score > best){ store.set('ss-best', String(r.score)); newBest = true; }
  }
  if(r.mode === 'daily'){
    const log = dailyLog(); const d = log[r.date] || {best:0, plays:0};
    if(r.score > d.best){ d.best = r.score; newBest = d.plays > 0; }
    d.plays++; log[r.date] = d; store.put('ss-daily', log);
  }
  History.add({ts:Date.now(), date:todayKey(), mode:r.mode, score:r.score || 0, level:r.level || '', n:sum.n,
    acc:sum.acc, rtMedian:sum.rtMedian, switchCost:sum.switchCost, congruency:sum.congruency, commission:sum.commission, dprime:sum.dprime});
  LAST = {r, sum, newBest, prev, save: r.mode === 'research' ? 'saving' : null, board:{state:'idle'}};
  renderResults(LAST); show('results');

}
function deltaHTML(L){
  const {sum, prev} = L;
  if(!prev.length) return `<span>${t('firstRun')}</span>`;
  const avg = k => mean(prev.map(x => x[k]).filter(v => v !== null && v !== undefined));
  const items = [];
  const a = avg('acc'); if(a !== null && sum.acc !== null){ const d = (sum.acc - a) * 100; items.push([t('d_acc'), (d >= 0 ? '+' : '') + d.toFixed(1) + ' pt', d > .5 ? 'up' : d < -.5 ? 'down' : '']); }
  const rt = avg('rtMedian'); if(rt !== null && sum.rtMedian !== null){ const d = sum.rtMedian - rt; items.push([t('d_rt'), (d > 0 ? '+' : '') + Math.round(d) + ' ms', d < -5 ? 'up' : d > 5 ? 'down' : '']); }
  const sw = avg('switchCost'); if(sw !== null && sum.switchCost !== null){ const d = sum.switchCost - sw; items.push([t('d_sw'), (d > 0 ? '+' : '') + Math.round(d) + ' ms', d < -5 ? 'up' : d > 5 ? 'down' : '']); }
  return `<span>${t('vsPrev', prev.length)}</span>` + items.map(([k, v, c]) => `<span class="delta ${c}">${h(k)} ${h(v)}</span>`).join('');
}
function renderResults(L){

function chartSVG(sum){
  const items = [['c_pure', sum.pure, ''], ['c_repeat', sum.repeat, ''], ['c_switch', sum.switch, 'sw'],
    ['c_cong', sum.congruent, ''], ['c_incong', sum.incongruent, 'sw'], ['c_mem', sum.memory, 'mem']].filter(x => x[1] !== null);
  if(!items.length) return `<div class="empty">–</div>`;
  const W = 560, H = 220, pl = 44, pb = 34, pt = 22, bw = Math.min(64, (W - pl - 10) / items.length - 18);
  const max = Math.max(...items.map(x => x[1]));
  const top = Math.ceil(max / 200) * 200 || 200;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for(let v = 0; v <= top; v += top / 4){ s += `<line class="grid" x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  const step = (W - pl - 10) / items.length;
  items.forEach(([k, v, cls], i) => {
    const cx = pl + step * i + step / 2;
    s += `<rect class="bar ${cls}" x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${H - pb - y(v)}" rx="4"/>`;
    s += `<text class="vlab" x="${cx}" y="${y(v) - 6}" text-anchor="middle">${Math.round(v)}</text>`;
    s += `<text x="${cx}" y="${H - pb + 18}" text-anchor="middle" style="font-family:var(--f-body);font-size:12px">${t(k)}</text>`;
  });
  return s + '</svg>';
}

const esc = v => { if(v === null || v === undefined) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = (rows, cols) => [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\n');

function lineChart(points, key, fmt, lowerBetter){
  const pts = points.filter(p => p[key] !== null && p[key] !== undefined && p[key] !== '').slice(-30);
  if(pts.length < 2) return `<div class="empty">${t('p_need')}</div>`;
  const W = 320, H = 150, pl = 40, pr = 34, pt = 14, pb = 18;
  const vals = pts.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi - lo < 1e-9){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * .15; lo -= pad; hi += pad;
  const x = i => pl + (W - pl - pr) * (i / (pts.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(v => { s += `<line class="grid" x1="${pl}" x2="${W - pr + 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; });
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');
  s += `<path class="area" d="${d} L${x(pts.length - 1)},${H - pb} L${x(0)},${H - pb} Z"/><path class="ln" d="${d}"/>`;
  pts.forEach((p, i) => { if(i < pts.length - 1) s += `<circle class="dot ${p.mode}" cx="${x(i)}" cy="${y(p[key])}" r="3"><title>${new Date(p.ts).toLocaleDateString()} · ${p.mode} · ${fmt(p[key])}</title></circle>`; });
  const lx = x(pts.length - 1), ly = y(vals[vals.length - 1]);
  s += `<circle class="end" cx="${lx}" cy="${ly}" r="5"/><text class="vlab" x="${lx + 7}" y="${ly + 4}">${fmt(vals[vals.length - 1])}</text>`;
  s += '</svg>';
  const first = mean(vals.slice(0, Math.min(5, vals.length - 1))), last = vals[vals.length - 1];
  const diff = last - first, good = lowerBetter ? diff < 0 : diff > 0;
  return s + `<div class="sub">${t('p_trend', fmt(Math.abs(diff)), good)}</div>`;
}
function renderProgress(){
  const all = History.all();
  const arc = all.filter(x => x.mode === 'arcade');
  const sws = all.map(x => x.switchCost).filter(v => v !== null && v !== undefined);
  $('#prog-tiles').innerHTML = [
    ['p_runs', all.length.toLocaleString()], ['p_best', arc.length ? Math.max(...arc.map(x => x.score)).toLocaleString() : '–'],
    ['p_streak', dailyStreak() + ' ' + t('days')], ['p_bestSw', sws.length ? fmtDiff(Math.min(...sws)) : '–']
  ].map(([k, v]) => `<div class="tile"><div class="k">${t(k)}</div><div class="v">${v}</div></div>`).join('');
  const pts = all.map(x => ({...x, accPct: x.acc === null || x.acc === undefined ? null : x.acc * 100}));
  $('#prog-charts').innerHTML = [
    ['pc_sw', 'switchCost', v => Math.round(v) + '', true, 'pc_lower'],
    ['pc_rt', 'rtMedian', v => Math.round(v) + '', true, 'pc_lower'],

  ].map(([title, key, fmt, lower, note]) => `<div class="chartbox"><h3>${t(title)}</h3><div class="sub">${t(note)}</div>${lineChart(pts, key, fmt, lower)}</div>`).join('');
}

    DATA = out;
  }catch(e){ console.error(e); DATA = []; }
  renderDataTable();
}
$('#go-data').addEventListener('click', () => { show('data'); loadData(); });
$('#data-refresh').addEventListener('click', loadData);
$('#data-back').addEventListener('click', home);
$('#data-sum').addEventListener('click', () => {
  if(!DATA || !DATA.length) return;
  offerFile(`signal-shift_summary_${new Date().toISOString().slice(0, 10)}.csv`, toCSV(DATA.map(d => d.row), SUM_COLS), $('#data-status'));
});
$('#data-all').addEventListener('click', async () => {
  if(!DATA || !DATA.length) return;
  const st = $('#data-status'); st.hidden = false; st.className = 'status'; st.textContent = t('loading');
  const rows = [];
  try{
    for(const d of DATA){
      const doc = await DB.doc(`sessions/${d.uid}/runs/${d.row.runId}`).get();
      if(doc.exists) (doc.data().trials || []).forEach(x => rows.push(x));
    }
    st.hidden = true;
    offerFile(`signal-shift_trials_${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, TRIAL_COLS), st);
  }catch(e){ st.className = 'status err'; st.textContent = t('saveFail'); }
});

$('#go-research').addEventListener('click', () => { setupValid(); show('setup'); $('#pid').focus(); });
$('#go-how').addEventListener('click', () => show('how'));
$('#go-board').addEventListener('click', () => openBoard('daily'));
$('#go-progress').addEventListener('click', () => { show('progress'); renderProgress(); });
$('#prog-play').addEventListener('click', startDaily);
$('#prog-back').addEventListener('click', home);
$('#how-back').addEventListener('click', home);
$('#how-play').addEventListener('click', startArcade);
$('#setup-back').addEventListener('click', home);
$('#setup-start').addEventListener('click', () => { if(!$('#setup-start').disabled) startResearch(); });
$('#brand').addEventListener('click', () => { if(RUN) quitRun(); else home(); });

renderStatic();
startDemo();
window.__ss = {summarize, invNorm, keyFor, seeded, Backend, History, get last(){ return LAST; }};
})();
